name: relay-core-e2e-nightly

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  relay-core-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout relay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          path: beamfall-relay
          persist-credentials: false

      - name: Checkout core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          repository: beamfall/beamfall
          path: beamfall
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: beamfall-relay/go.mod

      - name: Relay core real-binary E2E
        working-directory: beamfall-relay
        run: BEAMFALL_CORE_REPO="$GITHUB_WORKSPACE/beamfall" script/relay-core-e2e.sh
