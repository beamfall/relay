name: gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout relay
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # ubuntu-latest has no golangci-lint preinstalled; `make gate` below
      # shells out to it directly (matching the local contributor gate), so
      # install the binary onto PATH rather than using the lint-action's own
      # runner (which would invoke lint outside of `make gate`). Pin an
      # explicit release tag rather than `@latest` so the toolchain fetched
      # during CI is reproducible and can't fetch-and-execute an
      # attacker-influenced newer build (SECREV-RELAY-7, compounds -2).
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v2.12.2

      # Run the exact same gate a contributor runs locally (build, vet,
      # gofmt, lint, race+coverage-floor tests) instead of a hand-duplicated
      # step list that silently drifted out of sync with `make gate`
      # (missing gofmt-check/lint/cover — AUDIT-RELAY-1).
      - name: Gate (make gate)
        run: make gate

      # Attacker-facing parsers: smoke the fuzz targets over their committed
      # corpora to catch crashers fast. Short fuzztime keeps the gate quick;
      # deep fuzzing is run manually / out of band.
      - name: Fuzz protocol frame reader
        run: go test ./internal/protocol -run='^$' -fuzz=FuzzReadFrame -fuzztime=30s

      - name: Fuzz ClientHello SNI parser
        run: go test ./internal/sni -run='^$' -fuzz=FuzzParseClientHelloRecord -fuzztime=30s
