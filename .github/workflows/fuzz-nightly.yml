name: fuzz-nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: FuzzReadFrame
            pkg: ./internal/protocol/
          - name: FuzzParseClientHelloRecord
            pkg: ./internal/sni/
          - name: FuzzHMACVerifyV2
            pkg: ./internal/relay/

    steps:
      - name: Checkout relay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          path: beamfall-relay
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: beamfall-relay/go.mod
          cache-dependency-path: beamfall-relay/go.sum

      - name: Fuzz ${{ matrix.target.name }}
        working-directory: beamfall-relay
        run: go test -fuzz=${{ matrix.target.name }} -fuzztime=60s ${{ matrix.target.pkg }}

      - name: Upload crash corpus
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target.name }}-${{ github.run_id }}
          path: |
            beamfall-relay/${{ matrix.target.pkg }}testdata/fuzz/${{ matrix.target.name }}/
          if-no-files-found: ignore
          retention-days: 30
